name: Clean up container PR previews

on:
  workflow_call:
    inputs:
      shared-ref:
        description: Must match the ref used to call this workflow
        default: main
        type: string
      dry-run:
        description: Report matching images without deleting them
        default: false
        type: boolean

permissions:
  contents: read

# Match the build workflow's PR lock so closing a PR waits for its build.
concurrency:
  group: container-${{ github.repository }}-${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.number || 'preview-cleanup' }}
  cancel-in-progress: false

jobs:
  cleanup:
    if: >-
      ((github.event_name == 'pull_request' || github.event_name == 'pull_request_target') &&
       github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository) ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      pull-requests: read
    steps:
      # Never check out caller/PR sources. Fork close events are skipped.
      - name: Check out trusted cleanup tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: tuxcrate/github-actions
          ref: ${{ inputs.shared-ref }}
          persist-credentials: false
      - name: Build cleanup tooling
        run: go build -o "$RUNNER_TEMP/container-pr-cleanup" ./cmd/container-pr-cleanup
      - name: Delete previews belonging to closed PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: '"$RUNNER_TEMP/container-pr-cleanup" -dry-run="$DRY_RUN"'
