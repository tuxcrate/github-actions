name: Container

on:
  workflow_call:
    inputs:
      shared-ref:
        description: Must match the ref used to call this workflow
        default: main
        type: string
      docs-repository:
        description: Owner/repo to notify after publication (requires DOCS_TOKEN); set empty to disable
        default: tuxcrate/docs
        type: string
    secrets:
      DOCS_TOKEN:
        description: Optional GitHub App or fine-grained token with contents write access to the docs repository
        required: false
      docs-token:
        description: Legacy explicit token mapping; prefer inheriting DOCS_TOKEN
        required: false

permissions:
  contents: read

# All publishing entry points must use this workflow so revisions and aliases
# cannot race. PRs have their own group and cannot cancel a release.
concurrency:
  group: container-${{ github.repository }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'release' }}
  cancel-in-progress: false

jobs:
  assign-pull-request:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login != 'renovate[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Assign non-Renovate PR to Skaronator
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        # Fork PRs have a read-only token. Keep assignment separate from builds
        # and do not check out or execute PR code in this job.
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/assignees" -f 'assignees[]=Skaronator' --silent

  plan:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Check out container sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: source
          persist-credentials: false
      - name: Require root meta.yaml
        working-directory: source
        run: |
          if [[ ! -f meta.yaml ]]; then
            echo '::error::A meta.yaml file is required in the caller repository root.'
            exit 1
          fi
      - name: Check out shared release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: tuxcrate/github-actions
          ref: ${{ inputs.shared-ref }}
          path: shared
          persist-credentials: false
      - name: Build release tooling
        run: go build -C shared -o "$RUNNER_TEMP/container-release" ./cmd/container-release
      - name: Validate root meta.yaml and tag ownership
        id: plan
        working-directory: source
        run: '"$RUNNER_TEMP/container-release" plan'

  pull-request:
    name: pull-request (${{ matrix.track }})
    needs: plan
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      pull-requests: write
    env:
      # Fork PRs stay build-only. Never use pull_request_target
      # to give untrusted container builds access to registry credentials.
      PUBLISH_PR: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Check out container sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Prepare PR image tags
        id: preview
        env:
          IMAGE_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TRACK: ${{ matrix.track }}
          COMMIT_SHA: ${{ github.sha }}
          PLATFORMS: ${{ matrix.platforms }}
        run: |
          image="ghcr.io/${IMAGE_REPOSITORY,,}-pr"
          tag="pr-${PR_NUMBER}-${TRACK}"
          {
            echo "image=$image"
            echo "platform=${PLATFORMS%%,*}"
            echo 'tags<<PR_IMAGE_TAGS'
            echo "$image:$tag"
            echo "$image:$tag-$COMMIT_SHA"
            echo 'PR_IMAGE_TAGS'
          } >> "$GITHUB_OUTPUT"
      - name: Check out shared test and validation tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: tuxcrate/github-actions
          ref: ${{ inputs.shared-ref }}
          path: .tuxcrate-release-tooling
          persist-credentials: false
      - name: Build artifact tooling
        run: go build -C .tuxcrate-release-tooling -o "$RUNNER_TEMP/container-artifact" ./cmd/container-artifact
      - name: Install OCI image tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends skopeo
      - name: Build all platforms into a local OCI archive
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.containerfile }}
          platforms: ${{ matrix.platforms }}
          build-args: |
            ${{ matrix.build-args }}
            BUILDKIT_DOCKERFILE_CHECK=skip=InvalidDefaultArgInFrom
          pull: true
          outputs: type=oci,dest=${{ runner.temp }}/container-${{ matrix.track }}.tar
          secrets: |
            github_token=${{ github.event.pull_request.head.repo.full_name == github.repository && secrets.GITHUB_TOKEN || '' }}
          # Preserve ownership even when a rerun leaves an older index untagged.
          annotations: |
            index:io.tuxcrate.repository=${{ github.repository }}
            index:io.tuxcrate.pull-request=${{ github.event.pull_request.number }}
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ matrix.image-version }}
          # Check current package availability on every architecture, including
          # reruns after an upstream repository finishes publishing a version.
          no-cache: true
          cache-from: type=gha,scope=container-pr-${{ github.event.pull_request.number }}-${{ matrix.track }}
          cache-to: type=gha,mode=max,scope=container-pr-${{ github.event.pull_request.number }}-${{ matrix.track }}
      - name: Test every platform from the built archive
        id: tested
        env:
          PLATFORMS: ${{ matrix.platforms }}
          APP_VERSION: ${{ matrix.version }}
          TRACK: ${{ matrix.track }}
        run: '"$RUNNER_TEMP/container-artifact" test "$RUNNER_TEMP/container-$TRACK.tar" "$PLATFORMS" "$APP_VERSION"'
      - name: Generate and validate synthetic release metadata
        env:
          APP_VERSION: ${{ matrix.version }}
          IMAGE_VERSION: ${{ matrix.image-version }}
          TRACK: ${{ matrix.track }}
          TAGS: ${{ matrix.tags }}
          PRERELEASE: ${{ matrix.prerelease }}
          IMAGE: ${{ matrix.image }}
          # The OCI digest is real, but this metadata is only a local fixture.
          IMAGE_DIGEST: ${{ steps.tested.outputs.digest }}
          PLATFORMS: ${{ matrix.platforms }}
          LOCAL_IMAGE: ${{ steps.tested.outputs.image }}
        run: |
          set -euo pipefail
          go build -C .tuxcrate-release-tooling -o "$RUNNER_TEMP/container-release" ./cmd/container-release
          mkdir -p "$RUNNER_TEMP/pr-release-metadata"
          cd "$RUNNER_TEMP/pr-release-metadata"
          "$RUNNER_TEMP/container-release" check-manifest
      - name: Log in to GHCR after successful tests
        if: env.PUBLISH_PR == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload the tested artifact and publish PR tags
        if: env.PUBLISH_PR == 'true'
        env:
          IMAGE: ${{ steps.preview.outputs.image }}
          IMAGE_DIGEST: ${{ steps.tested.outputs.digest }}
          IMAGE_TAGS: ${{ steps.preview.outputs.tags }}
          TRACK: ${{ matrix.track }}
        run: |
          "$RUNNER_TEMP/container-artifact" publish "$RUNNER_TEMP/container-$TRACK.tar" "$IMAGE"
          while IFS= read -r tag; do
            docker buildx imagetools create --tag "$tag" "$IMAGE@$IMAGE_DIGEST"
          done <<< "$IMAGE_TAGS"
      - name: Comment PR image pull instructions
        if: env.PUBLISH_PR == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TRACK: ${{ matrix.track }}
          IMAGE: ${{ steps.preview.outputs.image }}
          IMAGE_DIGEST: ${{ steps.tested.outputs.digest }}
          COMMIT_SHA: ${{ github.sha }}
          PLATFORMS: ${{ matrix.platforms }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          marker="<!-- tuxcrate-pr-image:$TRACK -->"
          tag="pr-${PR_NUMBER}-${TRACK}"
          release_json="$(cat "$RUNNER_TEMP/pr-release-metadata/release.json")"
          body="$(cat <<EOF
          $marker
          ### Container preview: \`$TRACK\`

          Built for merge commit \`$COMMIT_SHA\` on \`$PLATFORMS\`.

          Pull the latest build of this PR:
          \`\`\`sh
          docker pull $IMAGE:$tag
          \`\`\`

          Pull the build for this commit:
          \`\`\`sh
          docker pull $IMAGE:$tag-$COMMIT_SHA
          \`\`\`

          Pin this exact image (tags may change on reruns):
          \`\`\`sh
          docker pull $IMAGE@$IMAGE_DIGEST
          \`\`\`

          [Build details]($RUN_URL). Preview images are for testing, not production.

          <details>
          <summary>Synthetic release.json (validation only)</summary>

          Generated to validate release metadata. Revision \`r0\` is a placeholder, not a published release revision; the digest identifies the tested multiarch artifact.

          \`\`\`json
          $release_json
          \`\`\`

          </details>
          EOF
          )"
          comments="repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments"
          comment_id="$(gh api --paginate --slurp "$comments" | jq -r --arg marker "$marker" \
            '[.[][] | select(.user.login == "github-actions[bot]" and (.body | startswith($marker)))][0].id // empty')"
          if [[ -n "$comment_id" ]]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" -f body="$body" --silent
          else
            gh api --method POST "$comments" -f body="$body" --silent
          fi

  # Branch protection requires this fixed check, not dynamic matrix job names.
  # Superseded prerelease tracks are intentionally absent from the build matrix.
  pull-request-check:
    needs: [plan, pull-request]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require planning and all active track builds to succeed
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          BUILD_RESULT: ${{ needs.pull-request.result }}
        run: |
          if [[ "$PLAN_RESULT" != success || "$BUILD_RESULT" != success ]]; then
            echo "::error::Container PR validation failed: plan=$PLAN_RESULT, builds=$BUILD_RESULT"
            exit 1
          fi

  release:
    name: release (${{ matrix.track }})
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    permissions:
      contents: write
      packages: write
    defaults:
      run:
        shell: bash
        working-directory: source
    steps:
      - name: Check out container sources and release history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Check out shared release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: tuxcrate/github-actions
          ref: ${{ inputs.shared-ref }}
          path: shared
          persist-credentials: false
      - name: Build release tooling
        run: |
          go build -C ../shared -o "$RUNNER_TEMP/container-release" ./cmd/container-release
          go build -C ../shared -o "$RUNNER_TEMP/container-artifact" ./cmd/container-artifact
      - name: Validate release metadata
        id: metadata
        env:
          APP_VERSION: ${{ matrix.version }}
          IMAGE: ${{ matrix.image }}
        run: '"$RUNNER_TEMP/container-release" metadata'
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Install OCI image tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends skopeo
      - name: Build all platforms into a local OCI archive
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: source/${{ matrix.context }}
          file: source/${{ matrix.containerfile }}
          platforms: ${{ matrix.platforms }}
          build-args: |
            ${{ matrix.build-args }}
            BUILDKIT_DOCKERFILE_CHECK=skip=InvalidDefaultArgInFrom
          # Pull alone does not refresh a cached apt-get layer. Every release
          # must actually install the currently available security updates.
          pull: true
          no-cache: true
          outputs: type=oci,dest=${{ runner.temp }}/container-${{ matrix.track }}.tar
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ matrix.image-version }}
          cache-to: type=gha,mode=max,scope=container-${{ matrix.track }}
      - name: Test every platform from the built archive
        id: tested
        env:
          PLATFORMS: ${{ matrix.platforms }}
          APP_VERSION: ${{ matrix.version }}
          TRACK: ${{ matrix.track }}
        run: '"$RUNNER_TEMP/container-artifact" test "$RUNNER_TEMP/container-$TRACK.tar" "$PLATFORMS" "$APP_VERSION"'
      - name: Validate final image OS metadata before upload
        env:
          APP_VERSION: ${{ matrix.version }}
          IMAGE_VERSION: ${{ matrix.image-version }}
          TRACK: ${{ matrix.track }}
          TAGS: ${{ matrix.tags }}
          PRERELEASE: ${{ matrix.prerelease }}
          IMAGE: ${{ matrix.image }}
          IMAGE_DIGEST: ${{ steps.tested.outputs.digest }}
          PLATFORMS: ${{ matrix.platforms }}
          LOCAL_IMAGE: ${{ steps.tested.outputs.image }}
        run: |
          mkdir -p "$RUNNER_TEMP/release-validation"
          cd "$RUNNER_TEMP/release-validation"
          "$RUNNER_TEMP/container-release" check-manifest
      - name: Log in to GHCR after successful tests
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload the tested multiarch artifact by digest
        env:
          IMAGE: ${{ steps.metadata.outputs.image }}
          TRACK: ${{ matrix.track }}
        run: '"$RUNNER_TEMP/container-artifact" publish "$RUNNER_TEMP/container-$TRACK.tar" "$IMAGE"'
      - name: Reserve revision and create draft release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_VERSION: ${{ matrix.version }}
          IMAGE_VERSION: ${{ matrix.image-version }}
          TRACK: ${{ matrix.track }}
          TAGS: ${{ matrix.tags }}
          PRERELEASE: ${{ matrix.prerelease }}
          IMAGE: ${{ steps.metadata.outputs.image }}
          IMAGE_DIGEST: ${{ steps.tested.outputs.digest }}
          PLATFORMS: ${{ matrix.platforms }}
        run: '"$RUNNER_TEMP/container-release" reserve'
      - name: Attach machine-readable release metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_VERSION: ${{ matrix.version }}
          IMAGE_VERSION: ${{ matrix.image-version }}
          TRACK: ${{ matrix.track }}
          TAGS: ${{ matrix.tags }}
          PRERELEASE: ${{ matrix.prerelease }}
          IMAGE: ${{ steps.metadata.outputs.image }}
          IMAGE_DIGEST: ${{ steps.tested.outputs.digest }}
          PLATFORMS: ${{ matrix.platforms }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/container-release" manifest
          gh release upload "$RELEASE_TAG" release.json
      - name: Publish revision tag and moving aliases
        env:
          IMAGE: ${{ steps.metadata.outputs.image }}
          IMAGE_DIGEST: ${{ steps.tested.outputs.digest }}
          IMAGE_TAGS: ${{ steps.release.outputs.tags }}
        run: |
          set -euo pipefail
          # The immutable revision is first. Its draft release is retained if
          # anything fails, so subsequent runs allocate a new revision.
          while IFS= read -r tag; do
            docker buildx imagetools create --tag "${IMAGE}:${tag}" "${IMAGE}@${IMAGE_DIGEST}"
          done <<< "$IMAGE_TAGS"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          MAKE_LATEST: ${{ steps.release.outputs.latest }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest="$MAKE_LATEST"

  notify-docs:
    needs: release
    if: needs.release.result == 'success' && inputs.docs-repository != ''
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Request docs refresh
        # Publication is already complete; scheduled docs builds recover a
        # missed notification without allocating another image revision.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.docs-token || secrets.DOCS_TOKEN }}
          DOCS_REPOSITORY: ${{ inputs.docs-repository }}
        run: |
          set -euo pipefail
          if [[ -z "$GH_TOKEN" ]]; then
            echo '::warning::Docs refresh skipped: make DOCS_TOKEN available to the caller and forward it with secrets: inherit or an explicit mapping.'
            exit 0
          fi
          [[ "$DOCS_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          gh api --method POST "repos/$DOCS_REPOSITORY/dispatches" -f event_type=image-published
