name: Container

on:
  workflow_call:
    inputs:
      shared-ref:
        description: Must match the ref used to call this workflow
        default: main
        type: string
      website-repository:
        description: Optional owner/repo to notify after publication (requires website-token)
        default: ''
        type: string
    secrets:
      website-token:
        description: Optional GitHub App or fine-grained token with contents write access to the website repository
        required: false

permissions:
  contents: read

# All publishing entry points must use this workflow so revisions and aliases
# cannot race. PRs have their own group and cannot cancel a release.
concurrency:
  group: container-${{ github.repository }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'release' }}
  cancel-in-progress: false

jobs:
  assign-pull-request:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login != 'renovate[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Assign non-Renovate PR to Skaronator
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        # Fork PRs have a read-only token. Keep assignment separate from builds
        # and do not check out or execute PR code in this job.
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/assignees" -f 'assignees[]=Skaronator' --silent

  plan:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Check out container sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: source
          persist-credentials: false
      - name: Require root meta.yaml
        working-directory: source
        run: |
          if [[ ! -f meta.yaml ]]; then
            echo '::error::A meta.yaml file is required in the caller repository root.'
            exit 1
          fi
      - name: Check out shared release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: tuxcrate/github-actions
          ref: ${{ inputs.shared-ref }}
          path: shared
          persist-credentials: false
      - name: Build release tooling
        run: go build -C shared -o "$RUNNER_TEMP/container-release" ./cmd/container-release
      - name: Validate root meta.yaml and alias ownership
        id: plan
        working-directory: source
        run: '"$RUNNER_TEMP/container-release" plan'

  pull-request:
    name: pull-request (${{ matrix.track }})
    needs: plan
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      pull-requests: write
    env:
      # Fork PRs stay build-only. Never use pull_request_target
      # to give untrusted container builds access to registry credentials.
      PUBLISH_PR: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Check out container sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Prepare PR image tags
        id: preview
        env:
          IMAGE_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TRACK: ${{ matrix.track }}
          COMMIT_SHA: ${{ github.sha }}
          PLATFORMS: ${{ matrix.platforms }}
        run: |
          image="ghcr.io/${IMAGE_REPOSITORY,,}-pr"
          tag="pr-${PR_NUMBER}-${TRACK}"
          {
            echo "image=$image"
            echo "platform=${PLATFORMS%%,*}"
            echo 'tags<<PR_IMAGE_TAGS'
            echo "$image:$tag"
            echo "$image:$tag-$COMMIT_SHA"
            echo 'PR_IMAGE_TAGS'
          } >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR for PR images
        if: env.PUBLISH_PR == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build all platforms and publish eligible PR images
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.containerfile }}
          platforms: ${{ matrix.platforms }}
          build-args: |
            ${{ matrix.build-args }}
            BUILDKIT_DOCKERFILE_CHECK=skip=InvalidDefaultArgInFrom
          pull: true
          push: ${{ env.PUBLISH_PR == 'true' }}
          tags: ${{ steps.preview.outputs.tags }}
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ matrix.version }}
          # Check current package availability on every architecture, including
          # reruns after an upstream repository finishes publishing a version.
          no-cache: true
          cache-from: type=gha,scope=container-pr-${{ github.event.pull_request.number }}-${{ matrix.track }}
          cache-to: type=gha,mode=max,scope=container-pr-${{ github.event.pull_request.number }}-${{ matrix.track }}
      - name: Load first platform for OS metadata validation
        id: local-image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.containerfile }}
          platforms: ${{ steps.preview.outputs.platform }}
          build-args: |
            ${{ matrix.build-args }}
            BUILDKIT_DOCKERFILE_CHECK=skip=InvalidDefaultArgInFrom
          load: true
          tags: tuxcrate-pr-os-check:${{ matrix.track }}
          provenance: false
          sbom: false
          # Reuse the just-built layers, including for fork PRs that cannot push.
          cache-from: type=gha,scope=container-pr-${{ github.event.pull_request.number }}-${{ matrix.track }}
      - name: Check out shared OS validation tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: tuxcrate/github-actions
          ref: ${{ inputs.shared-ref }}
          path: .tuxcrate-release-tooling
          persist-credentials: false
      - name: Generate and validate synthetic release metadata
        env:
          APP_VERSION: ${{ matrix.version }}
          TRACK: ${{ matrix.track }}
          ALIASES: ${{ matrix.aliases }}
          IMAGE: ${{ matrix.image }}
          # This is a local image ID, not a published multiarch digest. The
          # generated manifest is only a validation fixture, never a release.
          IMAGE_DIGEST: ${{ steps.local-image.outputs.imageid }}
          PLATFORMS: ${{ matrix.platforms }}
          LOCAL_IMAGE: tuxcrate-pr-os-check:${{ matrix.track }}
        run: |
          set -euo pipefail
          go build -C .tuxcrate-release-tooling -o "$RUNNER_TEMP/container-release" ./cmd/container-release
          mkdir -p "$RUNNER_TEMP/pr-release-metadata"
          cd "$RUNNER_TEMP/pr-release-metadata"
          "$RUNNER_TEMP/container-release" check-manifest
      - name: Comment PR image pull instructions
        if: env.PUBLISH_PR == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TRACK: ${{ matrix.track }}
          IMAGE: ${{ steps.preview.outputs.image }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          COMMIT_SHA: ${{ github.sha }}
          PLATFORMS: ${{ matrix.platforms }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          marker="<!-- tuxcrate-pr-image:$TRACK -->"
          tag="pr-${PR_NUMBER}-${TRACK}"
          release_json="$(cat "$RUNNER_TEMP/pr-release-metadata/release.json")"
          body="$(cat <<EOF
          $marker
          ### Container preview: \`$TRACK\`

          Built for merge commit \`$COMMIT_SHA\` on \`$PLATFORMS\`.

          Pull the latest build of this PR:
          \`\`\`sh
          docker pull $IMAGE:$tag
          \`\`\`

          Pull the build for this commit:
          \`\`\`sh
          docker pull $IMAGE:$tag-$COMMIT_SHA
          \`\`\`

          Pin this exact image (tags may change on reruns):
          \`\`\`sh
          docker pull $IMAGE@$IMAGE_DIGEST
          \`\`\`

          [Build details]($RUN_URL). Preview images are for testing, not production.

          <details>
          <summary>Synthetic release.json (validation only)</summary>

          Generated to validate release metadata. Revision \`r0\` and the local image ID are placeholders, not a published release revision or multiarch digest.

          \`\`\`json
          $release_json
          \`\`\`

          </details>
          EOF
          )"
          comments="repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments"
          comment_id="$(gh api --paginate --slurp "$comments" | jq -r --arg marker "$marker" \
            '[.[][] | select(.user.login == "github-actions[bot]" and (.body | startswith($marker)))][0].id // empty')"
          if [[ -n "$comment_id" ]]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" -f body="$body" --silent
          else
            gh api --method POST "$comments" -f body="$body" --silent
          fi

  release:
    name: release (${{ matrix.track }})
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    permissions:
      contents: write
      packages: write
    defaults:
      run:
        shell: bash
        working-directory: source
    steps:
      - name: Check out container sources and release history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Check out shared release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: tuxcrate/github-actions
          ref: ${{ inputs.shared-ref }}
          path: shared
          persist-credentials: false
      - name: Build release tooling
        run: go build -C ../shared -o "$RUNNER_TEMP/container-release" ./cmd/container-release
      - name: Validate release metadata
        id: metadata
        env:
          APP_VERSION: ${{ matrix.version }}
          IMAGE: ${{ matrix.image }}
        run: '"$RUNNER_TEMP/container-release" metadata'
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Rebuild and publish multiarch image by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: source/${{ matrix.context }}
          file: source/${{ matrix.containerfile }}
          platforms: ${{ matrix.platforms }}
          build-args: |
            ${{ matrix.build-args }}
            BUILDKIT_DOCKERFILE_CHECK=skip=InvalidDefaultArgInFrom
          # Pull alone does not refresh a cached apt-get layer. Every release
          # must actually install the currently available security updates.
          pull: true
          no-cache: true
          outputs: type=image,name=${{ steps.metadata.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ matrix.version }}
          cache-to: type=gha,mode=max,scope=container-${{ matrix.track }}
      - name: Reserve revision and create draft release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_VERSION: ${{ matrix.version }}
          TRACK: ${{ matrix.track }}
          ALIASES: ${{ matrix.aliases }}
          IMAGE: ${{ steps.metadata.outputs.image }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          PLATFORMS: ${{ matrix.platforms }}
        run: '"$RUNNER_TEMP/container-release" reserve'
      - name: Attach machine-readable release metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_VERSION: ${{ matrix.version }}
          TRACK: ${{ matrix.track }}
          ALIASES: ${{ matrix.aliases }}
          IMAGE: ${{ steps.metadata.outputs.image }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          PLATFORMS: ${{ matrix.platforms }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/container-release" manifest
          gh release upload "$RELEASE_TAG" release.json
      - name: Publish revision tag and moving aliases
        env:
          IMAGE: ${{ steps.metadata.outputs.image }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_TAGS: ${{ steps.release.outputs.tags }}
        run: |
          set -euo pipefail
          # The immutable revision is first. Its draft release is retained if
          # anything fails, so subsequent runs allocate a new revision.
          while IFS= read -r tag; do
            docker buildx imagetools create --tag "${IMAGE}:${tag}" "${IMAGE}@${IMAGE_DIGEST}"
          done <<< "$IMAGE_TAGS"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          MAKE_LATEST: ${{ steps.release.outputs.latest }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest="$MAKE_LATEST"

  notify-website:
    needs: release
    if: needs.release.result == 'success' && inputs.website-repository != ''
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Request website refresh
        # Publication is already complete; scheduled website builds recover a
        # missed notification without allocating another image revision.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.website-token }}
          WEBSITE_REPOSITORY: ${{ inputs.website-repository }}
        run: |
          set -euo pipefail
          if [[ -z "$GH_TOKEN" ]]; then
            echo '::warning::Website refresh skipped: configure the WEBSITE_TOKEN secret in the caller repository.'
            exit 0
          fi
          [[ "$WEBSITE_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          gh api --method POST "repos/$WEBSITE_REPOSITORY/dispatches" -f event_type=image-published
