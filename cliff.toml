[changelog]
header = ""
body = """
{% for commit in commits %}\
- {{ commit.message | split(pat="\n") | first }} ([{{ commit.id | truncate(length=7, end="") }}]($REPOSITORY_URL/commit/{{ commit.id }}))
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = false
filter_unconventional = false
filter_commits = false
# The release script supplies an explicit range. Ignore all tags so a security
# rebuild on an already-tagged commit still renders one list of changes.
tag_pattern = "^$"
sort_commits = "oldest"
